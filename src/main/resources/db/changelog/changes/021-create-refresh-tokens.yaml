databaseChangeLog:
  - changeSet:
      id: 021-create-refresh-tokens
      author: formation
      changes:
        - createTable:
            tableName: refresh_tokens
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: token
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: utilisateur_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: expiration
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: revoque
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: refresh_tokens
            baseColumnNames: utilisateur_id
            referencedTableName: utilisateurs
            referencedColumnNames: id
            constraintName: fk_refresh_token_utilisateur
            onDelete: CASCADE
