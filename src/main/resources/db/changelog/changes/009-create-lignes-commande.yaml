databaseChangeLog:
  - changeSet:
      id: 009-create-lignes-commande
      author: formation
      changes:
        - createTable:
            tableName: lignes_commande
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: quantite
                  type: INTEGER
                  constraints:
                    nullable: false
              - column:
                  name: prix_unitaire
                  type: DECIMAL(10, 2)
                  constraints:
                    nullable: false
              - column:
                  name: id_commande
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_lignes_commande
                    references: commandes(id)
              - column:
                  name: id_produit
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_lignes_produit
                    references: produits(id)
