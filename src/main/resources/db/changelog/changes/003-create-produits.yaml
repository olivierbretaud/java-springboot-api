databaseChangeLog:
  - changeSet:
      id: 003-create-table-produits
      author: formation
      changes:
        - createTable:
            tableName: produits
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: nom
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: VARCHAR(500)
              - column:
                  name: prix
                  type: DECIMAL(10, 2)
              - column:
                  name: unite_par_packaging
                  type: INTEGER
                  defaultValueNumeric: 1
                  constraints:
                    nullable: false
              - column:
                  name: id_categorie
                  type: BIGINT
                  constraints:
                    foreignKeyName: fk_produits_categorie
                    references: categories(id)
              - column:
                  name: date_creation
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: date_modification
                  type: TIMESTAMP
                  constraints:
                    nullable: false
