databaseChangeLog:
  - changeSet:
      id: 006-insert-premier-utilisateur
      author: formation
      validCheckSum: "9:c7c302a4690f503e704cfc4ed8187f46"
      changes:
        - insert:
            tableName: utilisateurs
            columns:
              - column:
                  name: email
                  value: "admin@formation.com"
              - column:
                  name: nom
                  value: "Admin"
              - column:
                  name: prenom
                  value: "Super"
              - column:
                  name: date_creation
                  valueDate: "now()"
              - column:
                  name: date_modification
                  valueDate: "now()"

        - insert:
            tableName: utilisateur_roles
            columns:
              - column:
                  name: utilisateur_id
                  valueComputed: "(SELECT id FROM utilisateurs WHERE email = 'admin@formation.com')"
              - column:
                  name: role
                  value: "MEMBRE"
