spring:
  application:
    name: formation-api

  # Configuration PostgreSQL
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/formation_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  # JPA/Hibernate
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  # Mail
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}

server:
  port: 8086
  servlet:
    context-path: /api

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  jwt:
    # Clé dev (32 octets en Base64). Remplacer par JWT_SECRET dans .env en production.
    secret: ${JWT_SECRET:YWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWE=}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

# Logging
logging:
  level:
    root: INFO
    com.formation: DEBUG
