databaseChangeLog:
  - changeSet:
      id: 008-create-commandes
      author: formation
      changes:
        - createTable:
            tableName: commandes
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: statut
                  type: VARCHAR(20)
                  defaultValue: EN_ATTENTE
                  constraints:
                    nullable: false
              - column:
                  name: montant_total
                  type: DECIMAL(10, 2)
                  constraints:
                    nullable: false
              - column:
                  name: id_utilisateur
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_commandes_utilisateur
                    references: utilisateurs(id)
              - column:
                  name: date_creation
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: date_modification
                  type: TIMESTAMP
                  constraints:
                    nullable: false
