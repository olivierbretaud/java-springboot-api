databaseChangeLog:
  - changeSet:
      id: 004-create-table-utilisateurs
      author: formation
      changes:
        - createTable:
            tableName: utilisateurs
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: email
                  type: VARCHAR(150)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: mot_de_passe
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: nom
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: date_creation
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: date_modification
                  type: TIMESTAMP
                  constraints:
                    nullable: false

  - changeSet:
      id: 004-create-table-utilisateur-roles
      author: formation
      changes:
        - createTable:
            tableName: utilisateur_roles
            columns:
              - column:
                  name: utilisateur_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_utilisateur_roles_utilisateur
                    references: utilisateurs(id)
              - column:
                  name: role
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
