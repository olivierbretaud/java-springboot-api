databaseChangeLog:
  - changeSet:
      id: 014-create-roles
      author: formation
      changes:
        - createTable:
            tableName: roles
            columns:
              - column:
                  name: id
                  type: BIGINT
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: code
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: libelle
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
        - createSequence:
            sequenceName: roles_id_seq
            startValue: 3
            incrementBy: 1
        - addDefaultValue:
            tableName: roles
            columnName: id
            defaultValueSequenceNext: roles_id_seq

  - changeSet:
      id: 014-insert-roles
      author: formation
      changes:
        - insert:
            tableName: roles
            columns:
              - column: { name: id, valueNumeric: 1 }
              - column: { name: code, value: "MEMBRE" }
              - column: { name: libelle, value: "Membre" }
        - insert:
            tableName: roles
            columns:
              - column: { name: id, valueNumeric: 2 }
              - column: { name: code, value: "ADMIN" }
              - column: { name: libelle, value: "Admin" }
